name: Day 14 quality gate

on:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run agent and evaluate golden dataset
        env:
          AGENT_VERSION: v2
          PORT: 8002
          MOCK_ERROR_RATE: 0
        run: |
          python -m pip install -r requirements.txt
          python app.py &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 +            http://127.0.0.1:8002/health
          python eval/run_eval.py --url http://127.0.0.1:8002 --min-accuracy 0.85
